name: Container bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/flexisticker/live-studio:latest
            ghcr.io/flexisticker/live-studio:${{ github.sha }}
            ghcr.io/flexisticker/michamodus-medien:latest
            ghcr.io/flexisticker/michamodus-medien:${{ github.sha }}
  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: renderer
          push: true
          tags: |
            ghcr.io/flexisticker/live-studio-renderer:latest
            ghcr.io/flexisticker/live-studio-renderer:${{ github.sha }}
