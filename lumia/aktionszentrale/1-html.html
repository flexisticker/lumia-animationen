<main class="az">
  <header><h1 id="titel">MichaModus · Aktionszentrale</h1><div class="head-r"><button id="musikSchnell" class="quick" style="display:none">🔇 Musik aus</button><div id="status" class="status">bereit</div><a id="admin" class="admin" href="/studio" style="display:none">⚙️ Verwaltung</a></div></header>
  <section id="nameRow" class="name-row"><input id="name" placeholder="Name (optional, z. B. Gewinner)" maxlength="24"><button class="clear" id="nameClear">×</button></section>
  <h2 id="kanalTitel" style="display:none">Kanal</h2>
  <div class="grid scenes" id="kanaele" style="display:none"></div>
  <h2>Modus</h2>
  <div class="grid scenes" id="modes"></div>
  <h2 id="spielTitel" style="display:none">Was läuft gerade? (Spiel oder Talk)</h2>
  <div class="grid scenes" id="spiele" style="display:none"></div>
  <h2 id="musikTitel" style="display:none">Musik</h2>
  <section id="musikExtra" class="vol-row" style="display:none"><button id="musikWeiter" class="quick">⏭ Nächstes Stück</button><button id="musikReihe" class="quick aus">🔀 Zufall</button><span id="musikInfo" class="hint"></span></section>
  <section id="musikRegler" class="vol-row" style="display:none"><span class="vol-ico">🔈</span><input id="musikVol" type="range" min="0" max="100" step="1"><b id="musikVolWert">35 %</b></section>
  <div class="grid" id="musik" style="display:none"></div>
  <h2>Ansagen</h2>
  <div class="grid scenes" id="scenes"></div>
  <h2>Gimmicks & Sounds</h2>
  <div class="grid" id="buttons"></div>
  <h2 id="testTitle">Test: Geschenke & Ereignisse</h2>
  <div class="grid small" id="tests"></div>
</main>
