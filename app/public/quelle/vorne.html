<title>MichaModus – vorne</title><style>/* MichaModus – Animationen (Lumia Custom Overlay, Reiter CSS) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
body { font-family: 'Baloo 2', system-ui, sans-serif; --c1: #ff3d7f; --c2: #ffb347; --b1: #ff3d7f; --b2: #7c4dff; --b3: #ffd54f; }
#fx { z-index: 1; position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#clip { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#fx.fallback { mix-blend-mode: screen; }

/* Banner oben */
.banner { z-index: 4; white-space: nowrap; position: fixed; left: 0; right: 0; top: var(--bannerTop, 3vh); text-align: center; pointer-events: none;
  font-size: var(--bannerSize, 7vh); font-weight: 800; letter-spacing: .03em; line-height: 1; }
.banner.off { display: none; }
.banner span { display: inline-block; padding: 0 .2em;
  background: linear-gradient(90deg, var(--b1), var(--b2), var(--b3), var(--b1)) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 .35vh 0 rgba(30,0,40,.9)) drop-shadow(0 0 1.6vh var(--b2));
  animation: flow 6s linear infinite, float 3.2s ease-in-out infinite; }
.banner.hype span { animation: flow 1.2s linear infinite, hype .5s ease-out 3; }
@keyframes flow { to { background-position: 300% 0; } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-.8vh) rotate(1deg); } }
@keyframes hype { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-3deg); } 100% { transform: scale(1); } }

/* Namens-Karte */
#cards { z-index: 3; position: fixed; inset: 0; pointer-events: none; }
.card { position: absolute; left: 50%; top: var(--cardTop, 62%); transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 1.2vh; }
.avatar { width: 15vh; height: 15vh; border-radius: 50%; object-fit: cover; background: #222;
  border: .7vh solid #fff; box-shadow: 0 0 0 .5vh var(--c1), 0 0 6vh var(--c1);
  animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
.name { font-size: 7.2vh; font-weight: 800; line-height: 1; white-space: nowrap; letter-spacing: .02em; color: #fff;
  filter: drop-shadow(0 .45vh 0 rgba(40,0,30,.85)) drop-shadow(0 0 2.2vh var(--c1)); }
.name span { display: inline-block; animation: letter .55s cubic-bezier(.2,1.8,.4,1) both; }
.name .shine { background: linear-gradient(100deg, #fff 30%, var(--c2) 45%, #fff 60%) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 1.6s ease-in-out 2; }
.sub { font-size: 3.6vh; font-weight: 700; color: #fff; padding: .6vh 2.4vh; border-radius: 99vh; white-space: nowrap;
  background: linear-gradient(90deg, var(--c1), var(--c2)); box-shadow: 0 .6vh 2vh rgba(0,0,0,.35);
  animation: rise .5s .8s ease-out both; }
.count { display: inline-block; font-size: 1.25em; margin-left: .3em; animation: bump .35s ease-out; }
.card.out { animation: out .5s ease-in forwards; }
@keyframes pop { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
@keyframes letter { from { opacity: 0; transform: translateY(4vh) scale(.3) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(2vh); } to { opacity: 1; transform: none; } }
@keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes bump { 0% { transform: scale(1.8); } 100% { transform: scale(1); } }
@keyframes out { to { opacity: 0; transform: translate(-50%, -50%) scale(1.15); filter: blur(1vh); } }

/* Like-Fontäne */
#likes { z-index: 2; position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Ansagen (Pause, Gleich geht's weiter …) */
.scene { z-index: 5; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
  opacity: 0; transition: opacity .6s; }
.scene.show { opacity: 1; }
.scene.dim { background: radial-gradient(ellipse at center, rgba(20,8,40,.55), rgba(10,4,20,.85)); }
.scene-box { text-align: center; padding: 0 6vw; transform: scale(.6); transition: transform .7s cubic-bezier(.2,1.6,.4,1); }
.scene.show .scene-box { transform: scale(1); }
.scene-title { font-size: 9vh; font-weight: 800; line-height: 1.02;
  background: linear-gradient(90deg, var(--b1), var(--b3), var(--b2), var(--b1)) 0 0 / 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;

  animation: flow 4s linear infinite, breathe 2.4s ease-in-out infinite; }
.scene-sub { margin-top: 2vh; font-size: 3.6vh; font-weight: 700; color: #fff; text-shadow: 0 .4vh 1.5vh rgba(0,0,0,.6); }
.scene-sub .dots span { animation: dot 1.4s infinite; opacity: .2; }
.scene-sub .dots span:nth-child(2) { animation-delay: .2s; } .scene-sub .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes dot { 0%,100% { opacity: .2; } 30% { opacity: 1; } }

/* StreamPrint (virtueller Bondrucker) */
.sp { position: fixed; z-index: 2; opacity: 0; transform: translateY(3vh) scale(.96); transition: opacity .6s, transform .7s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
.sp.show { opacity: 1; transform: none; }
.sp iframe { position: relative; width: 100%; height: 100%; border: 0; background: transparent; border-radius: var(--spR, 18px); }
.sp.rahmen iframe { background: rgba(14,8,28,.35); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
.sp-glow { position: absolute; inset: -3px; border-radius: calc(var(--spR, 18px) + 3px); display: none;
  background: conic-gradient(from var(--spA, 0deg), var(--b1), var(--b2), var(--b3), var(--b1)); padding: 3px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); filter: drop-shadow(0 0 8px var(--b2)); animation: spspin 6s linear infinite; }
.sp.rahmen .sp-glow { display: block; }
@property --spA { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@keyframes spspin { to { --spA: 360deg; } }

/* Plattform-Schild (TikTok / Twitch) */
.pf { display: inline-block; font-weight: 800; font-size: 2.1vh; letter-spacing: .04em; padding: .25em .8em; border-radius: 999px; color: #fff; margin: 0 auto .5vh; text-transform: uppercase; }
.card .pf { display: table; }
.pf-tiktok { background: #010101; box-shadow: -3px 0 0 #25f4ee, 3px 0 0 #fe2c55; }
.pf-twitch { background: #9146ff; box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.liketag { position: absolute; right: 4vw; bottom: 26vh; display: flex; align-items: center; gap: .6em; font-weight: 800; font-size: 2.2vh; line-height: 1; color: #fff;
  text-shadow: 0 2px 6px rgba(0,0,0,.7); opacity: 0; transform: translateY(1vh); transition: opacity .3s, transform .3s; z-index: 30; pointer-events: none; }
.liketag .pf { margin: 0; font-size: 1.7vh; }
.liketag.show { opacity: 1; transform: none; }

/* Start/Ende mit Spiel-Hintergrund */
.scene-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .8s; }
.scene.voll .scene-bg { opacity: 1; }
.scene.voll { background: none; }
.scene.voll::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(10,4,20,.25), rgba(10,4,20,.7)); }
.scene-box { position: relative; z-index: 1; }
.scene-spiel { display: inline-block; margin-bottom: 2.2vh; padding: .35em 1.1em; border-radius: 999px; font-size: 3.4vh; font-weight: 800; color: #fff;
  background: linear-gradient(90deg, var(--b1), var(--b2)); box-shadow: 0 .6vh 2vh rgba(0,0,0,.45); }
.scene-uhr { margin-top: 2.5vh; font-size: 8vh; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; text-shadow: 0 .5vh 2vh rgba(0,0,0,.6); }
.scene-uhr:empty { display: none; }

/* Chat-Einblendung */
.chat { position: fixed; z-index: 3; display: flex; flex-direction: column; justify-content: flex-end; gap: .45em; overflow: hidden; pointer-events: none;
  opacity: 0; transition: opacity .5s; -webkit-mask: linear-gradient(transparent, #000 18%); mask: linear-gradient(transparent, #000 18%); }
.chat.show { opacity: 1; }

@keyframes chatIn { from { opacity: 0; transform: translateX(-1em); } }
.pf-youtube { background: #ff0033; } .pf-kick { background: #1fcf4a; color: #000; } .pf-facebook { background: #1877f2; } .pf-trovo { background: #19d65c; color: #000; } .pf-chat { background: #555; }

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) {
      if (name === 'mm_modus' || name === 'mm_spiel') {
        const r = await post('/api/modus', name === 'mm_modus' ? { modus: value } : { modus: 'zocken', spiel: value });
        if (!r.ok) throw new Error('Fehler'); return (await r.json()).obs || '';
      }
      if (name === 'mm_musik') { const r = await post('/api/musik', value); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_profil') { const r = await post('/api/profil', { profil: value }); if (!r.ok) throw new Error('Fehler'); }
    },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus; window.MM_PROFILE = s.profile || []; window.MM_PROFIL = s.profil; window.MM_SPIELE = s.spiele || []; window.MM_SPIEL = s.spiel; window.MM_MODUS = s.modus; window.MM_MUSIK = s.musik;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const fmt = /-quer\b/.test(location.pathname) ? 'quer' : /-hoch\b/.test(location.pathname) ? 'hoch' : (innerWidth > innerHeight ? 'quer' : 'hoch');
      const es = new EventSource('/api/events?rolle=' + ROLE + '&format=' + fmt + '&pfad=' + encodeURIComponent(location.pathname) + '&w=' + innerWidth + '&h=' + innerHeight);
      const modusMsg = d => { state.modus = d.modus; emit('overlaycontent', { content: 'spiel:' + JSON.stringify(d.spiel || null) }); emit('overlaycontent', { content: 'modus:' + state.modus }); };
      const musikMsg = m => { if (!m) return; window.MM_MUSIK = m; emit('overlaycontent', { content: 'musik:' + JSON.stringify(m) }); };
      es.addEventListener('hallo', e => { const d = JSON.parse(e.data); modusMsg(d); musikMsg(d.musik); });
      es.addEventListener('musik', e => musikMsg(JSON.parse(e.data)));
      es.addEventListener('chat', e => emit('chat', JSON.parse(e.data)));
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('spiele', () => { if (ROLE === 'aktion') setTimeout(() => location.reload(), 300); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>

const queue = [];

// Format der Quelle: Adresse …-quer / …-hoch (bzw. ?format=), sonst nach Fenstergröße
const FORMAT = /-quer\b|format=quer/.test(location.pathname + location.search) ? 'quer' : /-hoch\b|format=hoch/.test(location.pathname + location.search) ? 'hoch' : (innerWidth > innerHeight ? 'quer' : 'hoch');
function videoFor(a) {
  const m = D.medienAdresse || '';
  if (FORMAT === 'quer') { if (D['vq_' + a.id]) return D['vq_' + a.id]; if (!D['v_' + a.id] && a.quer) return m + a.quer; }
  return D['v_' + a.id] || (a.datei && m + a.datei) || '';
}
function enabled(a) { return on('an_' + a.id, true); }

function enqueue(item) {
  if (!item.anim || !enabled(item.anim)) return;
  // Aktionsknöpfe: nicht stapeln, sondern laufende Knopf-Animation abbrechen und neu starten
  const km = D.knopfModus || 'knopf';
  if (item.knopf && km !== 'anstellen') {
    for (let i = queue.length - 1; i >= 0; i--) if (queue[i].knopf) queue.splice(i, 1);
    if (playing && (playing.knopf || km === 'alles')) { stopNow(playing); queue.unshift(item); next(); return; }
    queue.unshift(item);
    if (!playing) next();
    return;
  }
  // Gleicher Spender + gleiches Geschenk: nur hochzählen
  if (item.key && on('comboZusammen')) {
    if (playing && playing.key === item.key && playing.card) { playing.amount += item.amount; updateCount(playing); return; }
    const w = queue.find(q => q.key === item.key);
    if (w) { w.amount += item.amount; return; }
  }
  if (queue.length >= num(D.maxWarteschlange, 30)) queue.shift();
  queue.push(item);
  if (!playing) next();
}

function next() {
  playing = queue.shift() || null;
  if (!playing) return;
  const item = playing;
  const src = videoFor(item.anim);
  if (item.anim.hype !== false) bannerHype();
  if (item.user && on('nameAn')) showCard(item);
  if (item.alert) setTimeout(() => sayThanks(item), num(D.ttsVerzoegerung, 1500));
  if (src) {
    video.src = src;
    video.volume = videoVol(item) * duck();
    video.currentTime = 0;
    video.play().then(() => requestAnimationFrame(drawFrame)).catch(() => finish(item));
    video.onended = () => finish(item);
    video.onerror = () => finish(item);

}

const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
function giftAnim(giftName, coinsTotal) {
  const n = norm(giftName);
  const extra = norm(D.eigeneZuordnung).split('\n'); // Format: "geschenkname = animations-id"
  for (const line of extra) { const [g, id] = line.split('=').map(s => s && s.trim()); if (g && id && g === n && entryById(id)) return entryById(id); }
  const direct = LIST.find(a => a.gruppe === 'geschenk' && (a.match || []).some(m => norm(m) === n));
  if (direct && enabled(direct)) return direct;
  const tiers = LIST.filter(a => a.gruppe === 'stufe').map(a => ({ a, ab: num(D['ab_' + a.id], a.ab) })).sort((x, y) => y.ab - x.ab);

function heart(x, y, s, color, a, rot) {

    const p = parts[i];
    p.vy += 0.12; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 1;
    const a = Math.min(1, p.life / 30);

}

  const n = eins ? Math.min(num(D.likeMax, 60), Math.max(1, Math.round(count)))

  start: ['szeneStart', 'Live startet gleich!', 'Schnapp dir was zu trinken', 0],
  pause: ['szenePause', 'Kurze Pause', 'Bleib dran – gleich geht\'s weiter', 0],
  gleich: ['szeneGleich', 'Gleich geht\'s weiter', 'Nicht weggehen', 0],
  weiter: ['szeneWeiter', 'Weiter geht\'s!', 'Schön, dass du noch da bist', 5],
  ende: ['szeneEnde', 'Danke & bis bald!', 'Folg MichaModus, dann verpasst du nichts', 0],
  brb: ['szeneBrb', 'Bin gleich zurück!', 'Nicht weggehen – es geht gleich weiter', 0],
  technik: ['szeneTechnik', 'Technische Störung', 'Wir sind gleich wieder da', 0],
};
const VOLLBILD = ['start', 'ende', 'brb', 'technik'];
let countdown = null;
const scene = document.getElementById('scene');
let sceneTimer = null, curSpiel = null;
const sceneBg = document.getElementById('sceneBg'), sceneSpiel = document.getElementById('sceneSpiel');
// Start/Ende passend zum eingestellten Spiel: eigener Text am Spiel › Vorlage mit {SPIEL}, dahinter der Spiel-Hintergrund im Vollbild
function sceneGame(id) {
  const sp = curSpiel && curSpiel.id !== 'standard' ? curSpiel : null;
  // BRB/Technik: eigenes Video aus den Einstellungen, sonst Spiel-Hintergrund; Start/Ende: Spiel-Hintergrund
  const eigenVid = { brb: [D.brbVideo, D.brbVideoQuer], technik: [D.technikVideo, D.technikVideoQuer] }[id];
  const ev = eigenVid && ((FORMAT === 'quer' && eigenVid[1]) || eigenVid[0] || eigenVid[1]);
  const voll = VOLLBILD.includes(id) && D.szeneSpielVollbild !== false;
  const src = !voll ? '' : ev || (sp ? (FORMAT === 'quer' && sp.videoQuer) || sp.video || sp.videoQuer : '');
  if (src) { if (sceneBg.getAttribute('src') !== src) sceneBg.src = src; sceneBg.play().catch(() => {}); } else { sceneBg.pause(); sceneBg.removeAttribute('src'); }
  scene.classList.toggle('voll', !!src);
  const zeile = !sp || !(id === 'start' || id === 'ende') ? '' : String(id === 'start' ? (D.szeneStartSpiel ?? 'Heute: {SPIEL}') : (D.szeneEndeSpiel ?? 'Danke fürs Zuschauen bei {SPIEL}!')).replace(/\{SPIEL\}/g, sp.name);
  sceneSpiel.textContent = zeile; sceneSpiel.style.display = zeile ? '' : 'none';
  const eigen = sp && (id === 'start' ? sp.start : id === 'ende' ? sp.ende : '');
  return eigen || '';
}
function showScene(id) {
  clearTimeout(sceneTimer);
  if (id === 'aus' || !SCENES[id]) { scene.classList.remove('show'); return; }
  const [key, t, s, secs] = SCENES[id];
  const eigen = sceneGame(id);
  const [title, sub] = String(eigen || D[key] || (t + ' | ' + s)).split('|').map(x => x.trim());
  document.getElementById('sceneTitle').textContent = title;
  const subEl = document.getElementById('sceneSub'); subEl.textContent = sub || '';
  if (!secs) { const d = document.createElement('span'); d.className = 'dots'; d.innerHTML = '<span>.</span><span>.</span><span>.</span>'; subEl.append(d); }
  // Countdown bei BRB (Minuten aus den Einstellungen, 0 = aus)
  clearInterval(countdown); document.getElementById('sceneUhr').textContent = '';
  const min = id === 'brb' ? num(D.szeneBrbMinuten, 0) : 0;
  if (min > 0) { const ende = Date.now() + min * 60000, uhr = document.getElementById('sceneUhr');
    const tick = () => { const r = Math.max(0, Math.round((ende - Date.now()) / 1000)); uhr.textContent = r ? Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0') : 'gleich!'; if (!r) clearInterval(countdown); };
    tick(); countdown = setInterval(tick, 1000); }
  scene.classList.toggle('dim', on('szeneAbdunkeln') && !secs);
  scene.classList.add('show'); bannerHype();
  if (id === 'weiter') likeBurst(40);
  if (secs) sceneTimer = setTimeout(() => scene.classList.remove('show'), secs * 1000);
}

window.MM = { handleAlert, handleContent, likeBurst, showScene, busy: () => !!playing || queue.length > 0 || scene.classList.contains('show') };

// ---------- Chat-Einblendung ----------
let chatManual = false;
const chatBox = document.getElementById('chat');
const PF_NAME = { tiktok: 'TikTok', twitch: 'Twitch', youtube: 'YouTube', kick: 'Kick', facebook: 'Facebook', trovo: 'Trovo' };
function chatUpdate() {
  const wann = D.chatWann || 'party';
  const show = wann === 'immer' || (wann === 'knopf' ? chatManual : wann === curMode);
  Object.assign(chatBox.style, { left: num(D.chatX, 4) + 'vw', top: num(D.chatY, 52) + 'vh', width: num(D.chatBreite, 60) + 'vw', height: num(D.chatHoehe, 30) + 'vh', fontSize: num(D.chatGroesse, 2.2) + 'vh' });
  chatBox.classList.toggle('blasen', D.chatHintergrund !== false);
  chatBox.classList.toggle('show', show);
}
function chatAdd(m) {
  if (m.entfernen) { const x = chatBox.querySelector(`[data-id="${CSS.escape(m.entfernen)}"]`); if (x) x.remove(); return; }
  if (on('chatBefehleWeg', true) && /^\s*!/.test(m.text)) return;
  const row = el('div', 'chat-msg'); row.dataset.id = m.id;
  const pf = el('span', 'pf pf-' + (PF_NAME[m.plattform] ? m.plattform : 'chat'), PF_NAME[m.plattform] || m.plattform || 'Chat');
  const name = el('b', 'chat-name', m.name); if (m.farbe) name.style.color = m.farbe;
  row.append(pf, name, el('span', 'chat-text', m.text));
  chatBox.append(row);
  while (chatBox.children.length > Math.max(1, num(D.chatMax, 8))) chatBox.firstChild.remove();
  const s = num(D.chatAusblenden, 45);
  if (s > 0) setTimeout(() => { row.classList.add('weg'); setTimeout(() => row.remove(), 600); }, s * 1000);
}
if (window.Overlay) Overlay.on('chat', chatAdd);

// ---------- StreamPrint (virtueller Bondrucker) ----------
let curMode = D.modusStart || 'party', spManual = false;
const sp = document.getElementById('sp'), spFrame = document.getElementById('spFrame');
function spUpdate() {
  const wann = D.spWann || 'aus';
  const show = !!D.spUrl && (wann === 'immer' || wann === curMode || (wann === 'knopf' && spManual));
  if (show && !spFrame.src) spFrame.src = D.spUrl;
  Object.assign(sp.style, { left: num(D.spX, 3) + 'vw', top: num(D.spY, 20) + 'vh', width: num(D.spBreite, 32) + 'vw', height: num(D.spHoehe, 60) + 'vh' });
  sp.style.setProperty('--spR', num(D.spRund, 18) + 'px');
  sp.classList.toggle('rahmen', D.spRahmen !== false);
  sp.classList.toggle('show', show);
}
spUpdate(); chatUpdate();

// ---------- Sounds für Like-Fontäne und Ansagen ----------
let lastLikeSfx = 0;
function sfx(url, vol) {
  if (!url) return;
  try { const a = new Audio(url); a.volume = Math.max(0, Math.min(1, num(D.lautstaerke, 80) / 100 * num(vol, 100) / 100)); a.play().catch(() => {}); } catch (e) {}
}
const _likeBurst = likeBurst;
likeBurst = function (count, echt) {
  if (on('likeAn') && performance.now() - lastLikeSfx > num(D.likeSoundAbstand, 1500)) { lastLikeSfx = performance.now(); sfx(D.likeSound, D.likeSoundLaut); }
  _likeBurst(count, echt);
};
const _showScene = showScene;
showScene = function (id) {
  if (id !== 'aus') sfx(D['sound_' + id], D.szeneSoundLaut);
  _showScene(id);
};
window.MM.likeBurst = likeBurst; window.MM.showScene = showScene;

});</script></body></html>
