<title>MichaModus – hinten</title><style>/* MichaModus – Hintergrund mit Zockmodus (hinter dem freigestellten Kamerabild) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap');

  background: conic-gradient(from var(--a, 0deg), var(--f1), var(--f2), var(--f3), var(--f1)); z-index: -1; }

@keyframes spin { to { --a: 360deg; } }

  font: 800 2.6vh 'Baloo 2', system-ui, sans-serif; color: #fff; letter-spacing: .06em; opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,1.6,.4,1);
  background: linear-gradient(90deg, var(--f1), var(--f2)); box-shadow: 0 0 2vh var(--f2); }
.tag.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) {
      if (name === 'mm_modus' || name === 'mm_spiel') {
        const r = await post('/api/modus', name === 'mm_modus' ? { modus: value } : { modus: 'zocken', spiel: value });
        if (!r.ok) throw new Error('Fehler'); return (await r.json()).obs || '';
      }
      if (name === 'mm_musik') { const r = await post('/api/musik', value); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_profil') { const r = await post('/api/profil', { profil: value }); if (!r.ok) throw new Error('Fehler'); }
    },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus; window.MM_PROFILE = s.profile || []; window.MM_PROFIL = s.profil; window.MM_SPIELE = s.spiele || []; window.MM_SPIEL = s.spiel; window.MM_MODUS = s.modus; window.MM_MUSIK = s.musik;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const fmt = /-quer\b/.test(location.pathname) ? 'quer' : /-hoch\b/.test(location.pathname) ? 'hoch' : (innerWidth > innerHeight ? 'quer' : 'hoch');
      const es = new EventSource('/api/events?rolle=' + ROLE + '&format=' + fmt + '&pfad=' + encodeURIComponent(location.pathname) + '&w=' + innerWidth + '&h=' + innerHeight);
      const modusMsg = d => { state.modus = d.modus; emit('overlaycontent', { content: 'spiel:' + JSON.stringify(d.spiel || null) }); emit('overlaycontent', { content: 'modus:' + state.modus }); };
      const musikMsg = m => { if (!m) return; window.MM_MUSIK = m; emit('overlaycontent', { content: 'musik:' + JSON.stringify(m) }); };
      es.addEventListener('hallo', e => { const d = JSON.parse(e.data); modusMsg(d); musikMsg(d.musik); });
      es.addEventListener('musik', e => musikMsg(JSON.parse(e.data)));
      es.addEventListener('chat', e => emit('chat', JSON.parse(e.data)));
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('spiele', () => { if (ROLE === 'aktion') setTimeout(() => location.reload(), 300); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>

r":"lacher-quer.mp4","label":"Lacher"},{"id":"wow","gruppe":"knopf","datei":"wow.mp4","quer":"wow-quer.mp4","label":"Wow"},{"id":"rimshot","gruppe":"knopf","datei":"rimshot.mp4","quer":"rimshot-quer.mp4","label":"Ba-dum-tss"},{"id":"herzregen","gruppe":"knopf","datei":"herzregen.mp4","quer":"herzregen-quer.mp4","label":"Herzregen"},{"id":"partyalarm","gruppe":"knopf","datei":"partyalarm.mp4","quer":"partyalarm-quer.mp4","label":"Party-Alarm"},{"id":"tw-follow","gruppe":"twitch","datei":"tw-follow.mp4","label":"Twitch: Follow"},{"id":"tw-sub","gruppe":"twitch","datei":"tw-sub.mp4","label":"Twitch: Sub"},{"id":"tw-primesub","gruppe":"twitch","datei":"tw-primesub.mp4","label":"Twitch: Prime-Sub"},{"id":"tw-resub","gruppe":"twitch","datei":"tw-resub.mp4","label":"Twitch: Resub"},{"id":"tw-giftsub","gruppe":"twitch","datei":"tw-giftsub.mp4","label":"Twitch: Geschenk-Subs"},{"id":"tw-bits-klein","gruppe":"twitch","datei":"tw-bits-klein.mp4","label":"Twitch: Bits klein"},{"id":"tw-bits-mittel","gruppe":"twitch","datei":"tw-bits-mittel.mp4","label":"Twitch: Bits mittel"},{"id":"tw-bits-gross","gruppe":"twitch","datei":"tw-bits-gross.mp4","label":"Twitch: Bits groß"},{"id":"tw-bits-episch","gruppe":"twitch","datei":"tw-bits-episch.mp4","label":"Twitch: Bits episch"},{"id":"tw-hypetrain-start","gruppe":"twitch","datei":"tw-hypetrain-start.mp4","label":"Twitch: Hype Train Start"},{"id":"tw-hypetrain-level","gruppe":"twitch","datei":"tw-hypetrain-level.mp4","label":"Twitch: Hype Train Level"},{"id":"tw-hypetrain-ende","gruppe":"twitch","datei":"tw-hypetrain-ende.mp4","label":"Twitch: Hype Train Ende"},{"id":"tw-raid","gruppe":"twitch","datei":"tw-raid.mp4","label":"Twitch: Raid"}]; window.MM_TESTS = [];
MM_START(function () {
// Hintergrund (hinter dem freigestellten Kamerabild): Party-Schleife, zweiter Modus (z. B. Zockerbude/Werkstatt), Musik
// und bis zu zwei Fenster (Spielaufnahme, Drucker-Kamera …). Die Quellen dafür liegen in OBS/LIVE Studio UNTER diesem Overlay,
// das Fenster schneidet hier ein Loch hinein. Umschalten des Modus: Steuerung („modus:party|zocken“).
const D = (window.Overlay && Overlay.data) || window.TEST_DATA || {};
const num = (x, d) => (x === '' || x == null || isNaN(Number(x)) ? d : Number(x));
const vP = document.getElementById('bgParty'), vZ = document.getElementById('bgZock');
const cv = document.getElementById('stage'), cx = cv.getContext('2d');
const m = document.getElementById('music');
const QUER = /-quer\b|format=quer/.test(location.pathname + location.search) ? true : /-hoch\b|format=hoch/.test(location.pathname + location.search) ? false : innerWidth > innerHeight;
const pick = (hoch, quer) => (QUER && quer ? quer : hoch);
if (D.videoAn !== false && pick(D.video, D.videoQuer)) { vP.src = pick(D.video, D.videoQuer); vP.play().catch(() => {}); }
if (pick(D.zockVideo, D.zockVideoQuer)) { vZ.src = pick(D.zockVideo, D.zockVideoQuer); vZ.play().catch(() => {}); }
[vP, vZ].forEach(v => (v.playbackRate = num(D.tempo, 100) / 100));
// Musik: Start mit Einstellungen, danach steuert die Aktionszentrale Titel und Lautstärke („musik:{datei,lautstaerke}“)
let musikZiel = Math.min(1, num(D.musikLautstaerke, 35) / 100), musikFade = null;
const musikStart = () => m.play().catch(() => setTimeout(() => { if (m.getAttribute('src')) musikStart(); }, 2000));
function fadeTo(vol, ms, done) {
  clearInterval(musikFade); const from = m.volume, t0 = performance.now();
  musikFade = setInterval(() => { const k = Math.min(1, (performance.now() - t0) / ms); m.volume = Math.max(0, Math.min(1, from + (vol - from) * k)); if (k >= 1) { clearInterval(musikFade); done && done(); } }, 40);
}
function setMusik(x) {
  if (!x) return;
  musikZiel = Math.max(0, Math.min(1, num(x.lautstaerke, 35) / 100));
  const src = (x.titel === 'standard' && D.musikAn === false) ? '' : (x.datei || '');
  if ((m.getAttribute('src') || '') === src) { if (src) fadeTo(musikZiel, 300); return; }
  const wechsel = () => { if (!src) { m.pause(); m.removeAttribute('src'); m.load(); return; } m.src = src; m.loop = true; m.volume = 0; musikStart(); fadeTo(musikZiel, 1200); };
  if (m.getAttribute('src') && !m.paused) fadeTo(0, src ? 700 : num(D.musikAusblendenMs, 2500), wechsel); else wechsel();
}
if (D.musikAn !== false && D.musik && !(window.MM_MUSIK)) { m.src = D.musik; m.loop = true; m.volume = musikZiel; musikStart(); }
let mode = D.modus === 'zocken' ? 'zocken' : 'party';
let t = mode === 'zocken' ? 1 : 0;
const DUR = num(D.uebergangMs, 1400);
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();
function cover(v) {
  if (!v.videoWidth) return null;
  const va = v.videoWidth / v.videoHeight, ca = cv.width / cv.height;
  let w = cv.width, h = cv.height; if (va > ca) w = h * va; else h = w / va;
  return [(cv.width - w) / 2, (cv.height - h) / 2, w, h];
}
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

// Fenster 1 und 2
const WIN = [1, 2].map(n => {
  // Querformat-Quelle (…-quer): eigene Lage/Größe/Format/Wann, wenn „eigene Lage“ an ist (Hochkant und Quer getrennt einstellbar)
  const QK = ['Wann', 'X', 'Y', 'Breite', 'Hoehe', 'Format'];
  const g = k => (QUER && D['f' + n + 'QuerEigen'] !== false && QK.includes(k) && D['f' + n + 'Q' + k] !== undefined && D['f' + n + 'Q' + k] !== '') ? D['f' + n + 'Q' + k] : D['f' + n + k];
  const frame = document.getElementById('frame' + n), tag = document.getElementById('tag' + n);
  frame.style.setProperty('--f1', g('Farbe1') || '#00e5ff'); frame.style.setProperty('--f2', g('Farbe2') || '#7c4dff'); frame.style.setProperty('--f3', g('Farbe3') || '#ff3d7f');
  frame.style.setProperty('--r', num(g('Rund'), 24) + 'px');
  tag.style.setProperty('--f1', g('Farbe1') || '#00e5ff'); tag.style.setProperty('--f2', g('Farbe2') || '#7c4dff');

  return { n, g, frame, tag, t: 0 };
});
let curSpiel = null;
function want(w) { const a = w.g('Wann') || 'aus'; if (mode === 'zocken' && curSpiel && curSpiel.ohneFenster && a !== 'immer') return false; return a === 'immer' || a === mode; }
function rect(w) {
  const W = cv.width * num(w.g('Breite'), 80) / 100;
  const fmt = { '16:9': 16 / 9, '4:3': 4 / 3, '9:16': 9 / 16, '1:1': 1 }[w.g('Format')];
  const H = fmt ? W / fmt : cv.height * num(w.g('Hoehe'), 30) / 100;
  return { x: cv.width * num(w.g('X'), 50) / 100 - W / 2, y: cv.height * num(w.g('Y'), 40) / 100 - H / 2, w: W, h: H };
}
let last = performance.now();
function draw(now) {
  const dt = now - last; last = now;
  const target = mode === 'zocken' ? 1 : 0;
  if (t !== target) t = target > t ? Math.min(1, t + dt / DUR) : Math.max(0, t - dt / DUR);
  const e = ease(t);
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  cx.clearRect(0, 0, cv.width, cv.height);
  const cp = cover(vP);
  if (cp && e < 1) cx.drawImage(vP, ...cp);
  else if (!cp) { cx.fillStyle = '#120c1f'; cx.fillRect(0, 0, cv.width, cv.height); }
  if (e > 0) {
    cx.globalAlpha = e;
    const cz = cover(vZ);
    if (cz) cx.drawImage(vZ, ...cz);
    else if (cp) { cx.drawImage(vP, ...cp); cx.fillStyle = 'rgba(5,10,40,.55)'; cx.fillRect(0, 0, cv.width, cv.height); }

  }
  const dim = num(D.abdunkeln, 0) / 100;
  if (dim) { cx.fillStyle = `rgba(0,0,0,${dim})`; cx.fillRect(0, 0, cv.width, cv.height); }

    const tw = want(w) ? 1 : 0;
    if (w.t !== tw) w.t = tw > w.t ? Math.min(1, w.t + dt / DUR) : Math.max(0, w.t - dt / DUR);

      cx.globalCompositeOperation = 'source-over';
    }
    const shown = s > 0.97;
    Object.assign(w.frame.style, { left: r.x - 6 + 'px', top: r.y - 6 + 'px', width: r.w + 'px', height: r.h + 'px' });
    w.frame.classList.toggle('show', shown && w.g('Rahmen') !== false);
    // Schild: links/Mitte/rechts am Fenster + Feinverschiebung (in % der Fensterbreite bzw. Bildhöhe)
    const pos = w.g('SchildPos') || 'mitte', tagW = w.tag.offsetWidth || 0;
    const bx = pos === 'links' ? r.x + tagW / 2 + 12 : pos === 'rechts' ? r.x + r.w - tagW / 2 - 12 : r.x + r.w / 2;
    w.tag.style.left = (bx + r.w * num(w.g('SchildX'), 0) / 100) + 'px';
    w.tag.style.top = Math.max(8, r.y - 50 + cv.height * num(w.g('SchildY'), 0) / 100) + 'px';
    w.tag.classList.toggle('show', shown && !!w.g('Schild'));
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function setMode(v) {
  const next = String(v || '').toLowerCase() === 'zocken' ? 'zocken' : 'party';
  if (next !== mode && D.modusSound) { try { const a = new Audio(D.modusSound); a.volume = Math.min(1, num(D.modusSoundLaut, 80) / 100); a.play().catch(() => {}); } catch (e) {} }
  mode = next;
}
async function poll() {
  try { if (window.Overlay && Overlay.getVariable) { const v = await Overlay.getVariable('mm_modus'); if (v) setMode(v); } } catch (e) {}
  setTimeout(poll, 800);
}
poll();
// Spiel-Hintergrund: eigenes Video je Spiel, sonst der Standard-Hintergrund für Modus 2
const zockDefault = pick(D.zockVideo, D.zockVideoQuer);
function setSpiel(sp) {
  curSpiel = sp;
  const src = (sp && pick(sp.video, sp.videoQuer)) || zockDefault;
  if (src && vZ.getAttribute('src') !== src) { vZ.src = src; vZ.play().catch(() => {}); }
}
if (window.Overlay) Overlay.on('overlaycontent', d => {
  const c = String(d.content || '');
  if (c.startsWith('modus:')) setMode(c.slice(6));
  if (c.startsWith('spiel:')) { try { setSpiel(JSON.parse(c.slice(6))); } catch (e) {} }
  if (c.startsWith('musik:')) { try { setMusik(JSON.parse(c.slice(6))); } catch (e) {} }
});
window.MMBG = { setMode };

});</script></body></html>
