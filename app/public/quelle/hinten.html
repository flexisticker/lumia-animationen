<html lang="de" data-rolle="hinten"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MichaModus – hinten</title><style>/* MichaModus – Hintergrund mit Zockmodus (hinter dem freigestellten Kamerabild) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap');
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
video { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; }
/* Leuchtrahmen um die Spiel-Öffnung */
.frame { position: fixed; pointer-events: none; opacity: 0; border-radius: var(--r, 24px);
  transition: opacity .6s; --w: 6px; padding: var(--w);
  background: conic-gradient(from var(--a, 0deg), var(--f1), var(--f2), var(--f3), var(--f1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spin 4s linear infinite; }
.frame.show { opacity: 1; }
.frame-glow { position: absolute; inset: -18px; border-radius: inherit; filter: blur(18px); opacity: .7;
  background: conic-gradient(from var(--a, 0deg), var(--f1), var(--f2), var(--f3), var(--f1)); z-index: -1; }
@property --a { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.tag { white-space: nowrap; position: fixed; transform: translate(-50%, 0) scale(.6); padding: .4vh 2vh; border-radius: 99vh;
  font: 800 2.6vh 'Baloo 2', system-ui, sans-serif; color: #fff; letter-spacing: .06em; opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,1.6,.4,1);
  background: linear-gradient(90deg, var(--f1), var(--f2)); box-shadow: 0 0 2vh var(--f2); }
.tag.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
</style></head>
<body><video id="bgParty" muted loop playsinline crossorigin="anonymous"></video>
<video id="bgZock" muted loop playsinline crossorigin="anonymous"></video>
<canvas id="stage"></canvas>
<div id="frame1" class="frame"><div class="frame-glow"></div></div>
<div id="frame2" class="frame"><div class="frame-glow"></div></div>
<div id="tag1" class="tag"></div>
<div id="tag2" class="tag"></div>
<audio id="music" loop></audio>

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) { if (name === 'mm_modus') { const r = await post('/api/modus', { modus: value }); if (!r.ok) throw new Error('Fehler'); } },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const es = new EventSource('/api/events?rolle=' + ROLE);
      es.addEventListener('hallo', e => { state.modus = JSON.parse(e.data).modus; emit('overlaycontent', { content: 'modus:' + state.modus }); });
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => { state.modus = JSON.parse(e.data).modus; emit('overlaycontent', { content: 'modus:' + state.modus }); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>

mp4","label":"Stufe episch"},{"id":"folgen","gruppe":"ereignis","datei":"folgen.mp4","label":"Neuer Follower"},{"id":"teilen","gruppe":"ereignis","datei":"teilen.mp4","label":"Live geteilt"},{"id":"superfan","gruppe":"ereignis","datei":"superfan.mp4","label":"Superfan"},{"id":"schatzkiste","gruppe":"ereignis","datei":"schatzkiste.mp4","label":"Schatzkiste"},{"id":"likeziel","gruppe":"ereignis","datei":"likeziel.mp4","label":"Like-Ziel"},{"id":"battle-sieg","gruppe":"ereignis","datei":"battle-sieg.mp4","label":"Battle-Ende"},{"id":"airhorn","gruppe":"knopf","datei":"airhorn.mp4","label":"Airhorn"},{"id":"torjubel","gruppe":"knopf","datei":"torjubel.mp4","label":"Torjubel"},{"id":"trommelwirbel","gruppe":"knopf","datei":"trommelwirbel.mp4","label":"Trommelwirbel"},{"id":"applaus","gruppe":"knopf","datei":"applaus.mp4","label":"Applaus"},{"id":"konfetti","gruppe":"knopf","datei":"konfetti.mp4","label":"Konfetti"},{"id":"verlosung","gruppe":"knopf","datei":"verlosung.mp4","label":"Verlosung"},{"id":"fanfare","gruppe":"knopf","datei":"fanfare.mp4","label":"Fanfare"},{"id":"lacher","gruppe":"knopf","datei":"lacher.mp4","label":"Lacher"},{"id":"wow","gruppe":"knopf","datei":"wow.mp4","label":"Wow"},{"id":"rimshot","gruppe":"knopf","datei":"rimshot.mp4","label":"Ba-dum-tss"},{"id":"herzregen","gruppe":"knopf","datei":"herzregen.mp4","label":"Herzregen"},{"id":"partyalarm","gruppe":"knopf","datei":"partyalarm.mp4","label":"Party-Alarm"}]; window.MM_TESTS = [];
MM_START(function () {
// Hintergrund (hinter dem freigestellten Kamerabild): Party-Schleife, zweiter Modus (z. B. Zockerbude/Werkstatt), Musik
// und bis zu zwei Fenster (Spielaufnahme, Drucker-Kamera …). Die Quellen dafür liegen in OBS/LIVE Studio UNTER diesem Overlay,
// das Fenster schneidet hier ein Loch hinein. Umschalten des Modus: Steuerung („modus:party|zocken“).
const D = (window.Overlay && Overlay.data) || window.TEST_DATA || {};
const num = (x, d) => (x === '' || x == null || isNaN(Number(x)) ? d : Number(x));
const vP = document.getElementById('bgParty'), vZ = document.getElementById('bgZock');
const cv = document.getElementById('stage'), cx = cv.getContext('2d');
const m = document.getElementById('music');
if (D.videoAn !== false && D.video) { vP.src = D.video; vP.play().catch(() => {}); }
if (D.zockVideo) { vZ.src = D.zockVideo; vZ.play().catch(() => {}); }
[vP, vZ].forEach(v => (v.playbackRate = num(D.tempo, 100) / 100));
if (D.musikAn !== false && D.musik) {
  m.src = D.musik; m.volume = Math.min(1, num(D.musikLautstaerke, 35) / 100);
  const start = () => m.play().catch(() => setTimeout(start, 2000)); start();
}
let mode = D.modus === 'zocken' ? 'zocken' : 'party';
let t = mode === 'zocken' ? 1 : 0;
const DUR = num(D.uebergangMs, 1400);
function resize() { cv.width = innerWidth; cv.height = innerHeight; }
addEventListener('resize', resize); resize();
function cover(v) {
  if (!v.videoWidth) return null;
  const va = v.videoWidth / v.videoHeight, ca = cv.width / cv.height;
  let w = cv.width, h = cv.height; if (va > ca) w = h * va; else h = w / va;
  return [(cv.width - w) / 2, (cv.height - h) / 2, w, h];
}
const ease = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

// Fenster 1 und 2
const WIN = [1, 2].map(n => {
  const g = k => D['f' + n + k];
  const frame = document.getElementById('frame' + n), tag = document.getElementById('tag' + n);
  frame.style.setProperty('--f1', g('Farbe1') || '#00e5ff'); frame.style.setProperty('--f2', g('Farbe2') || '#7c4dff'); frame.style.setProperty('--f3', g('Farbe3') || '#ff3d7f');
  frame.style.setProperty('--r', num(g('Rund'), 24) + 'px');
  tag.style.setProperty('--f1', g('Farbe1') || '#00e5ff'); tag.style.setProperty('--f2', g('Farbe2') || '#7c4dff');
  tag.textContent = g('Schild') || '';
  return { n, g, frame, tag, t: 0 };
});
function want(w) { const a = w.g('Wann') || 'aus'; return a === 'immer' || a === mode; }
function rect(w) {
  const W = cv.width * num(w.g('Breite'), 80) / 100, H = cv.height * num(w.g('Hoehe'), 30) / 100;
  return { x: cv.width * num(w.g('X'), 50) / 100 - W / 2, y: cv.height * num(w.g('Y'), 40) / 100 - H / 2, w: W, h: H };
}
let last = performance.now();
function draw(now) {
  const dt = now - last; last = now;
  const target = mode === 'zocken' ? 1 : 0;
  if (t !== target) t = target > t ? Math.min(1, t + dt / DUR) : Math.max(0, t - dt / DUR);
  const e = ease(t);
  cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  cx.clearRect(0, 0, cv.width, cv.height);
  const cp = cover(vP);
  if (cp && e < 1) cx.drawImage(vP, ...cp);
  else if (!cp) { cx.fillStyle = '#120c1f'; cx.fillRect(0, 0, cv.width, cv.height); }
  if (e > 0) {
    cx.globalAlpha = e;
    const cz = cover(vZ);
    if (cz) cx.drawImage(vZ, ...cz);
    else if (cp) { cx.drawImage(vP, ...cp); cx.fillStyle = 'rgba(5,10,40,.55)'; cx.fillRect(0, 0, cv.width, cv.height); }
    cx.globalAlpha = 1;
  }
  const dim = num(D.abdunkeln, 0) / 100;
  if (dim) { cx.fillStyle = `rgba(0,0,0,${dim})`; cx.fillRect(0, 0, cv.width, cv.height); }
  for (const w of WIN) {
    const tw = want(w) ? 1 : 0;
    if (w.t !== tw) w.t = tw > w.t ? Math.min(1, w.t + dt / DUR) : Math.max(0, w.t - dt / DUR);
    const s = ease(w.t), r = rect(w);
    if (s > 0.02) {
      const ww = r.w * s, hh = r.h * Math.min(1, s * 1.15);
      cx.globalCompositeOperation = 'destination-out';
      cx.beginPath(); cx.roundRect(r.x + (r.w - ww) / 2, r.y + (r.h - hh) / 2, ww, hh, num(w.g('Rund'), 24)); cx.fill();
      cx.globalCompositeOperation = 'source-over';
    }
    const shown = s > 0.97;
    Object.assign(w.frame.style, { left: r.x - 6 + 'px', top: r.y - 6 + 'px', width: r.w + 'px', height: r.h + 'px' });
    w.frame.classList.toggle('show', shown && w.g('Rahmen') !== false);
    w.tag.style.top = Math.max(8, r.y - 50) + 'px'; w.tag.style.left = (r.x + r.w / 2) + 'px';
    w.tag.classList.toggle('show', shown && !!w.g('Schild'));
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function setMode(v) { mode = String(v || '').toLowerCase() === 'zocken' ? 'zocken' : 'party'; }
async function poll() {
  try { if (window.Overlay && Overlay.getVariable) { const v = await Overlay.getVariable('mm_modus'); if (v) setMode(v); } } catch (e) {}
  setTimeout(poll, 800);
}
poll();
if (window.Overlay) Overlay.on('overlaycontent', d => { const c = String(d.content || ''); if (c.startsWith('modus:')) setMode(c.slice(6)); });
window.MMBG = { setMode };

});</script></body></html>
