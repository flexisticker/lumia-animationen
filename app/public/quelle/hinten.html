<title>MichaModus – hinten</title><style>/* MichaModus – Hintergrund mit Zockmodus (hinter dem freigestellten Kamerabild) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap');
html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
/* Videos direkt anzeigen (Grafikkarte), Fenster-Loch per clip-path – kein Kopieren je Bild mehr */
#bg { position: fixed; inset: 0; background: #120c1f; pointer-events: none; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
#bg video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
#bgZock { opacity: 0; }
#dimZ { position: absolute; inset: 0; background: rgba(5,10,40,.55); opacity: 0; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; }
/* Leistungsmodus: Leuchtschein steht still (sich drehender Weichzeichner wurde jedes Bild neu berechnet) */
body.leicht .frame-glow { --a: 0deg; }
/* Leuchtrahmen um die Spiel-Öffnung */
.frame { position: fixed; pointer-events: none; opacity: 0; border-radius: var(--r, 24px);
  transition: opacity .6s; --w: 6px; padding: var(--w);
  background: conic-gradient(from var(--a, 0deg), var(--f1), var(--f2), var(--f3), var(--f1));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); animation: spin 4s linear infinite; }
.frame.show { opacity: 1; }
.frame-glow { position: absolute; inset: -18px; border-radius: inherit; filter: blur(18px); opacity: .7;
  background: conic-gradient(from var(--a, 0deg), var(--f1), var(--f2), var(--f3), var(--f1)); z-index: -1; }
@property --a { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
@keyframes spin { to { --a: 360deg; } }
.tag { white-space: nowrap; position: fixed; transform: translate(-50%, 0) scale(.6); padding: .4vh 2vh; border-radius: 99vh;
  font: 800 2.6vh 'Baloo 2', system-ui, sans-serif; color: #fff; letter-spacing: .06em; opacity: 0; transition: opacity .5s, transform .6s cubic-bezier(.2,1.6,.4,1);
  background: linear-gradient(90deg, var(--f1), var(--f2)); box-shadow: 0 0 2vh var(--f2); }
.tag.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

/* Wand-Monitor: letzte Unterstützer auf dem dunklen Bildschirm im Hintergrund */
.monitor { position: fixed; transform-origin: 0 0; opacity: 0; transition: opacity .8s; pointer-events: none; overflow: hidden; box-sizing: border-box;
  padding: .9em 1.3em; font-family: 'Baloo 2', system-ui, sans-serif; color: #fff;
  /* wie vom Bildschirm selbst ausgestrahlt: dunkel wie der Bildschirm, keine eigene Kante, Ränder laufen weich aus */
  background: radial-gradient(120% 80% at 50% 10%, rgba(124,77,255,.16), rgba(6,8,22,.55) 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 70%, transparent 100%); mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 70%, transparent 100%); }
.monitor.show { opacity: var(--monDeck, .92); }
.mon-titel { font-weight: 800; letter-spacing: .08em; text-align: center; color: #7dffd9; text-shadow: 0 0 1.2vh rgba(0,229,255,.7); margin-bottom: .7em; white-space: nowrap; line-height: 1; overflow: hidden; text-overflow: ellipsis; }
.mon-zeile { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: .5em; margin: 0 0 .55em 0; line-height: 1; white-space: nowrap; }
.mon-zeile.neu { animation: monRein .7s cubic-bezier(.2,1.4,.4,1); }
.mon-zeile:first-child { text-shadow: 0 0 1vh rgba(255,213,79,.6); }
.mon-ico { font-size: 1.15em; }
.mon-pf { font-size: .55em; font-weight: 800; letter-spacing: .06em; padding: .15em .5em; border-radius: 99em; }
.mon-pf.tiktok { background: #111; box-shadow: 0 0 0 1px #25f4ee, 0 0 0 2px #fe2c55; }
.mon-pf.twitch { background: #9146ff; }
.mon-pf.youtube { background: #ff0033; }
.mon-txt { overflow: hidden; text-overflow: ellipsis; }
.mon-txt b { font-weight: 800; }
.mon-txt span { opacity: .8; font-weight: 600; }
.mon-leer { text-align: center; opacity: .75; font-weight: 700; margin-top: 1.2em; font-size: .8em; text-shadow: 0 0 1vh rgba(124,77,255,.6); }
@keyframes monRein { from { opacity: 0; transform: translateY(-80%); } }
.monitor.zwei .mon-zeile { grid-template-columns: auto 1fr; margin-bottom: .5em; }
.monitor.zwei .mon-pf { display: none; }
.monitor.zwei .mon-txt b, .monitor.zwei .mon-txt span { display: block; overflow: hidden; text-overflow: ellipsis; }
.monitor.zwei .mon-txt span { font-size: .72em; margin-top: .12em; }
.monitor.zwei .mon-txt span::before { content: attr(data-pf) ' · '; opacity: .75; }
.mon-liste { overflow: hidden; -webkit-mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.6em), transparent); }

#bgNeu { opacity: 0; }
</style></head>

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); return r.json().catch(() => ({})); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) {
      if (name === 'mm_modus' || name === 'mm_spiel') {
        const r = await post('/api/modus', name === 'mm_modus' ? { modus: value } : { modus: 'zocken', spiel: value });
        if (!r.ok) throw new Error('Fehler'); return (await r.json()).obs || '';
      }
      if (name === 'mm_musik') { const r = await post('/api/musik', value); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_profil') { const r = await post('/api/profil', { profil: value }); if (!r.ok) throw new Error('Fehler'); }
    },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus; window.MM_PROFILE = s.profile || []; window.MM_PROFIL = s.profil; window.MM_SPIELE = s.spiele || []; window.MM_KATEGORIEN = s.kategorien || []; window.MM_SPIEL = s.spiel; window.MM_MODUS = s.modus; window.MM_MUSIK = s.musik; window.MM_FENSTER = s.fensterSicht;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const fmt = /-quer\b/.test(location.pathname) ? 'quer' : /-hoch\b/.test(location.pathname) ? 'hoch' : (innerWidth > innerHeight ? 'quer' : 'hoch');
      const es = new EventSource('/api/events?rolle=' + ROLE + '&format=' + fmt + '&pfad=' + encodeURIComponent(location.pathname) + '&w=' + innerWidth + '&h=' + innerHeight);
      const modusMsg = d => { state.modus = d.modus; emit('overlaycontent', { content: 'spiel:' + JSON.stringify(d.spiel || null) }); emit('overlaycontent', { content: 'modus:' + state.modus }); };
      const musikMsg = m => { if (!m) return; window.MM_MUSIK = m; emit('overlaycontent', { content: 'musik:' + JSON.stringify(m) }); };
      es.addEventListener('hallo', e => { const d = JSON.parse(e.data);
        // Neuer Programmstand (Update) → Seite neu laden, sobald nichts läuft (sonst lief alter Code weiter, bis man in OBS neu lädt)
        if (d.stand) { if (window.MM_STAND && window.MM_STAND !== d.stand) { const neu = () => (busy() ? setTimeout(neu, 500) : location.reload()); return neu(); } window.MM_STAND = d.stand; } modusMsg(d); musikMsg(d.musik); emit('overlaycontent', { content: 'fenster:' + JSON.stringify(d.fenster || {}) }); emit('letzte', { liste: d.letzte || [], monitor: d.monitor }); emit('overlaycontent', { content: JSON.stringify({ id: 'logo', an: !d.logoAus }) }); for (const id of ['chat', 'streamprint']) emit('overlaycontent', { content: JSON.stringify({ id, an: d.zwang ? d.zwang[id] ?? null : null }) }); });
      es.addEventListener('musik', e => musikMsg(JSON.parse(e.data)));
      es.addEventListener('chat', e => emit('chat', JSON.parse(e.data)));
      es.addEventListener('letzte', e => emit('letzte', { liste: JSON.parse(e.data) }));
      es.addEventListener('fensterstand', e => { const d = JSON.parse(e.data); emit('overlaycontent', { content: 'fenster:' + JSON.stringify(d.fenster || {}) }); emit('letzte', { monitor: d.monitor }); });
      es.addEventListener('fenster', e => { window.MM_FENSTER = JSON.parse(e.data); emit('fenster', window.MM_FENSTER); });
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('spiele', () => { if (ROLE === 'aktion') setTimeout(() => location.reload(), 300); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>
