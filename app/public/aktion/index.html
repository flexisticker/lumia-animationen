<title>MichaModus – Steuerung</title><style>/* MichaModus – Aktionszentrale (auf dem Tablet im Browser öffnen) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');
:root { --bg: #120c1f; --card: #1e1631; --line: #3a2d5c; --text: #fff; --muted: #b9a8e6; --c1: #ff3d7f; --c2: #7c4dff; --c3: #ffd54f; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Baloo 2', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.az { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 4px 0; font-size: 28px; font-weight: 800; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));

h2 { margin: 22px 0 10px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status { font-size: 15px; padding: 6px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }

.name-row { display: flex; gap: 8px; margin-top: 12px; }
.name-row input { flex: 1; font: inherit; font-size: 20px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); outline: none; }
.name-row input:focus { border-color: var(--c2); }
.name-row .clear { width: 56px; font-size: 26px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.grid.small { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.btn { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  min-height: 118px; padding: 10px; border-radius: 20px; border: 1px solid var(--line); cursor: pointer;
  background: linear-gradient(160deg, #2a1f45, #1a1330); color: var(--text); font: inherit; font-size: 19px; font-weight: 800;
  box-shadow: 0 6px 0 #0b0714, 0 10px 24px rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; touch-action: manipulation; }
.btn .ico { font-size: 44px; line-height: 1; }
.btn:active, .btn.hit { transform: translateY(5px); box-shadow: 0 1px 0 #0b0714, 0 4px 10px rgba(0,0,0,.35); }
.btn.hit::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 70%); animation: flash .5s ease-out forwards; }
@keyframes flash { to { opacity: 0; } }
.scenes .btn { min-height: 90px; font-size: 18px; background: linear-gradient(160deg, #3b1d4a, #1f1233); }
.scenes .btn.active { border-color: var(--c3); box-shadow: 0 6px 0 #0b0714, 0 0 0 3px var(--c3) inset; }
.small .btn { min-height: 84px; font-size: 15px; } .small .btn .ico { font-size: 28px; }
@media (max-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } h1 { font-size: 22px; } }
.head-r{display:flex;gap:8px;align-items:center}.admin{font-size:15px;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);text-decoration:none}

.vol-row { display: flex; align-items: center; gap: 14px; background: #1f1233; border-radius: 16px; padding: 14px 18px; margin-bottom: 12px; }
.vol-row input { flex: 1; height: 34px; accent-color: var(--c3); }
.vol-row b { min-width: 58px; text-align: right; font-size: 18px; }
.vol-ico { font-size: 24px; }
#musik .btn.active { border-color: var(--c3); box-shadow: 0 6px 0 #0b0714, 0 0 0 3px var(--c3) inset; }

.quick { font: inherit; font-size: 17px; font-weight: 800; padding: 10px 18px; border-radius: 99px; border: 2px solid var(--c3); background: #2a1640; color: #fff; cursor: pointer; }

header { position: sticky; top: 0; z-index: 10; background: var(--bg); padding-top: 8px; padding-bottom: 8px; }
.quick { white-space: nowrap; }
#musikExtra .hint{color:var(--muted);font-size:15px}

/* Oben: links Kanal & Modus, rechts Kameras & Fenster (Kacheln leuchten, wenn das Fenster zu sehen ist) */
.oben { display: grid; grid-template-columns: auto 1fr; gap: 0 28px; align-items: start; }

.fenster .btn.active .zu { opacity: 1; color: #7dffd9; }

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); return r.json().catch(() => ({})); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) {
      if (name === 'mm_modus' || name === 'mm_spiel') {
        const r = await post('/api/modus', name === 'mm_modus' ? { modus: value } : { modus: 'zocken', spiel: value });
        if (!r.ok) throw new Error('Fehler'); return (await r.json()).obs || '';
      }
      if (name === 'mm_musik') { const r = await post('/api/musik', value); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_profil') { const r = await post('/api/profil', { profil: value }); if (!r.ok) throw new Error('Fehler'); }
    },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus; window.MM_PROFILE = s.profile || []; window.MM_PROFIL = s.profil; window.MM_SPIELE = s.spiele || []; window.MM_KATEGORIEN = s.kategorien || []; window.MM_SPIEL = s.spiel; window.MM_MODUS = s.modus; window.MM_MUSIK = s.musik; window.MM_FENSTER = s.fensterSicht;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const fmt = /-quer\b/.test(location.pathname) ? 'quer' : /-hoch\b/.test(location.pathname) ? 'hoch' : (innerWidth > innerHeight ? 'quer' : 'hoch');
      const es = new EventSource('/api/events?rolle=' + ROLE + '&format=' + fmt + '&pfad=' + encodeURIComponent(location.pathname) + '&w=' + innerWidth + '&h=' + innerHeight);
      const modusMsg = d => { state.modus = d.modus; emit('overlaycontent', { content: 'spiel:' + JSON.stringify(d.spiel || null) }); emit('overlaycontent', { content: 'modus:' + state.modus }); };
      const musikMsg = m => { if (!m) return; window.MM_MUSIK = m; emit('overlaycontent', { content: 'musik:' + JSON.stringify(m) }); };
      es.addEventListener('hallo', e => { const d = JSON.parse(e.data);
        // Neuer Programmstand (Update) → Seite neu laden, sobald nichts läuft (sonst lief alter Code weiter, bis man in OBS neu lädt)
        if (d.stand) { if (window.MM_STAND && window.MM_STAND !== d.stand) { const neu = () => (busy() ? setTimeout(neu, 500) : location.reload()); return neu(); } window.MM_STAND = d.stand; } modusMsg(d); musikMsg(d.musik); emit('overlaycontent', { content: 'fenster:' + JSON.stringify(d.fenster || {}) }); emit('letzte', { liste: d.letzte || [], monitor: d.monitor }); emit('overlaycontent', { content: JSON.stringify({ id: 'logo', an: !d.logoAus }) }); for (const id of ['chat', 'streamprint']) emit('overlaycontent', { content: JSON.stringify({ id, an: d.zwang ? d.zwang[id] ?? null : null }) }); });
      es.addEventListener('musik', e => musikMsg(JSON.parse(e.data)));
      es.addEventListener('chat', e => emit('chat', JSON.parse(e.data)));
      es.addEventListener('letzte', e => emit('letzte', { liste: JSON.parse(e.data) }));
      es.addEventListener('fensterstand', e => { const d = JSON.parse(e.data); emit('overlaycontent', { content: 'fenster:' + JSON.stringify(d.fenster || {}) }); emit('letzte', { monitor: d.monitor }); });
      es.addEventListener('fenster', e => { window.MM_FENSTER = JSON.parse(e.data); emit('fenster', window.MM_FENSTER); });
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('spiele', () => { if (ROLE === 'aktion') setTimeout(() => location.reload(), 300); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }
async function send(payload, btn) {
  btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit');
  const aktion = JSON.stringify(payload);
  try {
    let r = null;
    if (window.Overlay) r = await Overlay.callCommand(D.befehl || 'mm-aktion', { aktion });
    else if (window.TEST_SEND) window.TEST_SEND(aktion);
    setStatus(r && r.label && /^(fenster|monitor|logo|licht|chat|streamprint)/.test(payload.id) ? r.label : 'gesendet: ' + (payload.label || payload.id), 'ok');
  } catch (e) { setStatus('Fehler – Befehl „' + (D.befehl || 'mm-aktion') + '“ vorhanden?', 'err'); }
}
function button(box, { id, label, ico }, extra = {}) {
  const b = document.createElement('button'); b.className = 'btn';
  const i = document.createElement('span'); i.className = 'ico'; i.textContent = ico || '✨';
  const t = document.createElement('span'); t.textContent = label;
  b.append(i, t);
  b.onclick = () => send({ id, label, name: nameIn.value.trim() || undefined, ...extra }, b);
  box.append(b); return b;
}

const TEST_NAMEN = ['Anna_Star', 'GamerJoe', 'Lisa💖', 'MichaFan99', 'Kevin_der_Große', 'SuperSandra', 'Tom aus Berlin', 'PixelPaul'];
const EREIGNIS_ALERT = { folgen: 'tiktok-follower', teilen: 'tiktok-share', superfan: 'tiktok-superFan', schatzkiste: 'tiktok-treasureChest', likeziel: 'tiktok-totalLikes', 'battle-sieg': 'tiktok-battleEnd' };
async function testEreignis(t, btn) {
  btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit');
  const name = nameIn.value.trim() || TEST_NAMEN[Math.floor(Math.random() * TEST_NAMEN.length)];
  const alert = t.gruppe === 'ereignis' ? EREIGNIS_ALERT[t.id] : 'tiktok-gift';
  if (!alert) return send({ id: t.id, label: t.label, name, text: 'Test' }, btn);
  const extra = { username: name, avatar: '/icon.png' };
  if (alert === 'tiktok-gift') Object.assign(extra, { giftName: t.geschenk, coins: Math.max(1, Number(t.ab) || 1), giftAmount: 1 });
  try {
    const r = await fetch('/api/test', { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify({ alert, extraSettings: extra }) });
    if (!r.ok) throw new Error();
    setStatus('Test: ' + t.label + ' von ' + name, 'ok');
  } catch (e) { setStatus('Test fehlgeschlagen', 'err'); }
}

function obsMeldung(text, info) {
  if (!info) return setStatus(text, 'ok');
  if (String(info).startsWith('OK:')) return setStatus(text + ' · OBS: ' + String(info).slice(3), 'ok');

}

      b.innerHTML = '<span class="ico"></span><span></span>'; b.firstChild.textContent = em ? em[1] : kat.ico || '🎮'; b.lastChild.textContent = em ? sp.name.slice(em[0].length) : sp.name;

  ['musik', 'musikTitel', 'musikRegler', 'musikExtra'].forEach(id => (document.getElementById(id).style.display = ''));
  const weiterB = document.getElementById('musikWeiter'), reiheB = document.getElementById('musikReihe'), infoE = document.getElementById('musikInfo');
  weiterB.onclick = () => send({ weiter: true }, 'Nächstes Stück');
  reiheB.onclick = () => send({ reihenfolge: reiheB.dataset.r === 'zufall' ? 'nacheinander' : 'zufall' });
  const extraShow = m => { reiheB.dataset.r = m.reihenfolge || 'zufall'; reiheB.textContent = reiheB.dataset.r === 'zufall' ? '🔀 Zufall' : '🔁 Nacheinander';
    const n = (m.dateien || []).length; infoE.textContent = m.titel === 'aus' ? '' : n > 1 ? n + ' Stücke in diesem Genre' : '1 Stück (Schleife)'; weiterB.disabled = n < 2; };
  const ICO = { standard: '🎉', hype: '⚡', funk: '🕺', chill: '☕', fantasy: '🐉', space: '🚀', synthwave: '🌆', chiptune: '👾', mittelalter: '🏰', mystisch: '🔮' };
  const mark = t => box.querySelectorAll('.btn').forEach(x => x.classList.toggle('active', x.dataset.id === t));
  const send = async (data, text) => { try { await Overlay.setVariable('mm_musik', data); if (text) setStatus(text, 'ok'); } catch (e) { setStatus('Fehler bei der Musik', 'err'); } };
  [...window.MM_MUSIK.liste, { id: 'aus', name: 'Musik aus' }].forEach(t => {
    const b = document.createElement('button'); b.className = 'btn'; b.dataset.id = t.id;
    b.innerHTML = '<span class="ico"></span><span></span>'; b.firstChild.textContent = t.id === 'aus' ? '⏹️' : (ICO[t.id] || '🎵'); b.lastChild.textContent = t.name;
    b.onclick = () => { mark(t.id); send({ titel: t.id }, t.id === 'aus' ? 'Musik aus' : 'Musik: ' + t.name); };
    box.append(b);
  });
  // Schnellknopf oben: Musik aus (blendet weich aus) / wieder an (letzter Titel)
  const quick = document.getElementById('musikSchnell'); quick.style.display = '';
  const quickShow = t => { const aus = t === 'aus'; quick.textContent = aus ? '🔊 Musik an' : '🔇 Musik aus'; quick.classList.toggle('aus', aus); quick.dataset.t = t; };
  quick.onclick = () => { const an = quick.dataset.t === 'aus'; quickShow(an ? 'an' : 'aus'); if (!an) mark('aus'); send({ titel: an ? 'an' : 'aus' }, an ? 'Musik an' : 'Musik blendet aus'); };
  const show = m => { mark(m.titel); quickShow(m.titel); extraShow(m); if (document.activeElement !== vol) { vol.value = m.lautstaerke; wert.textContent = m.lautstaerke + ' %'; } };
  show(window.MM_MUSIK);
  let tm = null;
  vol.oninput = () => { wert.textContent = vol.value + ' %'; clearTimeout(tm); tm = setTimeout(() => send({ lautstaerke: Number(vol.value) }), 120); };
  if (window.Overlay) Overlay.on('overlaycontent', d => { const c = String(d.content || ''); if (c.startsWith('musik:')) try { show(JSON.parse(c.slice(6))); } catch (e) {} });
}

// Kameras & Fenster: große Kacheln oben rechts, zeigen an, was gerade zu sehen ist
const fensterBox = document.getElementById('fenster');
const FENSTER = [[1, 'Spielfenster', '🪟'], [2, 'Drucker', '🖨️'], [3, 'Schreibtisch', '🖥️'], ['monitor', 'Monitor: Unterstützer', '📺'], ['monitor-drucker', 'Monitor: Drucker-Kamera', '🖨️'], ['logo', 'Logo', '🏷️'], ['chat', 'Chat', '💬'], ['streamprint', 'Bondrucker', '🧾'], ['licht', 'Licht (Hue)', '💡']].map(([nr, label, ico]) => {
  const b = document.createElement('button'); b.className = 'btn';
  b.innerHTML = '<span class="ico"></span><span></span><span class="zu"></span>'; b.children[0].textContent = ico; b.children[1].textContent = label;
  b.onclick = () => send({ id: typeof nr === 'string' ? nr : nr === 1 ? 'fenster' : 'fenster' + nr, label: label + ' ein/aus' }, b);
  fensterBox.append(b); return { nr, b };
});
function fensterZeigen(sicht) {
  for (const f of FENSTER) {
    if (f.nr === 'licht') f.b.style.display = sicht && sicht.lichtMoeglich ? '' : 'none';
    if (f.nr === 'logo') f.b.style.display = sicht && sicht.logoMoeglich ? '' : 'none';
    if (f.nr === 'streamprint') f.b.style.display = sicht && sicht.streamprintMoeglich ? '' : 'none';
    const an = !!(sicht && sicht[f.nr]); f.b.classList.toggle('active', an); f.b.children[2].textContent = an ? (f.nr === 'licht' ? '● folgt dem Stream' : String(f.nr).startsWith('monitor') ? '● an' : '● zu sehen') : (String(f.nr).startsWith('monitor') && sicht && !sicht.monitorMoeglich ? 'aus · tippen = Zockerbude' : 'aus'); }
}
fensterZeigen(window.MM_FENSTER);
if (window.Overlay && Overlay.on) Overlay.on('fenster', fensterZeigen);

});</script></body></html>
