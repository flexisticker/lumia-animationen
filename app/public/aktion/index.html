<!doctype html>
<html lang="de" data-rolle="aktion"><head><link rel="icon" href="/icon.png"><link rel="manifest" href="/aktion/manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#120c1f"><link rel="apple-touch-icon" href="/icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MichaModus – Steuerung</title><style>/* MichaModus – Aktionszentrale (auf dem Tablet im Browser öffnen) */
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap');
:root { --bg: #120c1f; --card: #1e1631; --line: #3a2d5c; --text: #fff; --muted: #b9a8e6; --c1: #ff3d7f; --c2: #7c4dff; --c3: #ffd54f; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Baloo 2', system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.az { max-width: 1200px; margin: 0 auto; padding: 16px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 4px 0; font-size: 28px; font-weight: 800; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
  -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { margin: 22px 0 10px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.status { font-size: 15px; padding: 6px 14px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
.status.ok { color: #7dffb0; border-color: #2f7a52; } .status.err { color: #ff8a8a; border-color: #7a2f2f; }
.name-row { display: flex; gap: 8px; margin-top: 12px; }
.name-row input { flex: 1; font: inherit; font-size: 20px; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); outline: none; }
.name-row input:focus { border-color: var(--c2); }
.name-row .clear { width: 56px; font-size: 26px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

.btn { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;

.scenes .btn.active { border-color: var(--c3); box-shadow: 0 6px 0 #0b0714, 0 0 0 3px var(--c3) inset; }

<script>// MichaModus Studio – Verbindung der Browserquellen/Seiten zum Programm (ersetzt die Lumia-Overlay-Schnittstelle)
(function () {
  const ROLE = document.documentElement.dataset.rolle; // vorne | hinten | aktion
  const BEREICH = { vorne: 'vorne', hinten: 'hinten', aktion: 'aktion' }[ROLE];
  const handlers = {};
  const state = { modus: 'party' };
  const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-mm': '1' }, body: JSON.stringify(data) });
  window.Overlay = {
    data: {},
    on(ev, cb) { (handlers[ev] ||= []).push(cb); },
    async callCommand(cmd, vars) { const r = await post('/api/aktion', JSON.parse(vars.aktion)); if (!r.ok) throw new Error('Fehler'); },
    async getVariable(name) { return name === 'mm_modus' ? state.modus : null; },
    async setVariable(name, value) {
      if (name === 'mm_modus') { const r = await post('/api/modus', { modus: value }); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_spiel') { const r = await post('/api/modus', { modus: 'zocken', spiel: value }); if (!r.ok) throw new Error('Fehler'); }
      if (name === 'mm_profil') { const r = await post('/api/profil', { profil: value }); if (!r.ok) throw new Error('Fehler'); }
    },
    async saveStorage() {}, async getStorage() { return null; }, async deleteStorage() {},
  };
  const emit = (ev, d) => (handlers[ev] || []).forEach(cb => { try { cb(d); } catch (e) { console.error(e); } });
  window.MM_START = async function (start) {
    const s = await (await fetch('/api/settings', { cache: 'no-store' })).json();
    Overlay.data = s[BEREICH] || {}; state.modus = s.modus; window.MM_PROFILE = s.profile || []; window.MM_PROFIL = s.profil; window.MM_SPIELE = s.spiele || []; window.MM_SPIEL = s.spiel; window.MM_MODUS = s.modus;
    start();
    let busy = () => window.MM && window.MM.busy && window.MM.busy();
    function connect() {
      const es = new EventSource('/api/events?rolle=' + ROLE);
      const modusMsg = d => { state.modus = d.modus; emit('overlaycontent', { content: 'spiel:' + JSON.stringify(d.spiel || null) }); emit('overlaycontent', { content: 'modus:' + state.modus }); };
      es.addEventListener('hallo', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('alert', e => emit('alert', JSON.parse(e.data)));
      es.addEventListener('aktion', e => emit('overlaycontent', { content: JSON.stringify(JSON.parse(e.data)) }));
      es.addEventListener('modus', e => modusMsg(JSON.parse(e.data)));
      es.addEventListener('spiele', () => { if (ROLE === 'aktion') setTimeout(() => location.reload(), 300); });
      es.addEventListener('settings', e => {
        const d = JSON.parse(e.data); if (d.bereich !== BEREICH) return;
        // Neue Einstellungen: Seite neu laden, sobald gerade nichts läuft
        const reload = () => (busy() ? setTimeout(reload, 500) : location.reload());
        setTimeout(reload, 150);
      });
      es.onerror = () => { es.close(); setTimeout(connect, 3000); };
    }
    connect();
  };
})();
</script>

MM_START(function () {
// MichaModus – Aktionszentrale (Lumia Custom Overlay, Reiter JS)
// Jeder Knopf ruft den Lumia-Befehl (Standard „mm-aktion“) mit der Variable {{aktion}} auf.
// Der Befehl schickt {{aktion}} per „Overlay: Inhalt senden“ an das Overlay „MichaModus – Animationen“.
const D = (window.Overlay && Overlay.data) || window.TEST_DATA || {};
const statusEl = document.getElementById('status');
if (document.documentElement.dataset.rolle === 'aktion') document.getElementById('admin').style.display = '';
document.getElementById('titel').textContent = D.titel || 'MichaModus · Aktionszentrale';
const nameIn = document.getElementById('name');
if (D.nameFeld === false) document.getElementById('nameRow').style.display = 'none';
document.getElementById('nameClear').onclick = () => { nameIn.value = ''; };

function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }
async function send(payload, btn) {
  btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit');
  const aktion = JSON.stringify(payload);
  try {
    if (window.Overlay) await Overlay.callCommand(D.befehl || 'mm-aktion', { aktion });
    else if (window.TEST_SEND) window.TEST_SEND(aktion);
    setStatus('gesendet: ' + (payload.label || payload.id), 'ok');
  } catch (e) { setStatus('Fehler – Befehl „' + (D.befehl || 'mm-aktion') + '“ vorhanden?', 'err'); }
}
function button(box, { id, label, ico }, extra = {}) {
  const b = document.createElement('button'); b.className = 'btn';
  const i = document.createElement('span'); i.className = 'ico'; i.textContent = ico || '✨';
  const t = document.createElement('span'); t.textContent = label;
  b.append(i, t);
  b.onclick = () => send({ id, label, name: nameIn.value.trim() || undefined, ...extra }, b);
  box.append(b); return b;
}

const SCENES = [['szene:start', 'Startet gleich', '⏳'], ['szene:pause', 'Kurze Pause', '☕'], ['szene:gleich', 'Gleich weiter', '⏱️'],
  ['szene:weiter', 'Weiter geht\'s!', '🚀'], ['szene:ende', 'Danke & Tschüss', '👋'], ['szene:aus', 'Ansage weg', '✖️'], ['likes', 'Like-Fontäne', '💗'], ['streamprint', 'Bondrucker ein/aus', '🧾']];
const sceneBox = document.getElementById('scenes');
SCENES.forEach(([id, label, ico]) => {
  const b = button(sceneBox, { id, label, ico });
  b.addEventListener('click', () => {
    sceneBox.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
    if (['szene:start', 'szene:pause', 'szene:gleich', 'szene:ende'].includes(id)) b.classList.add('active');
  });
});

const lines = String(D.knoepfe || '').split('\n').map(l => l.split('|').map(s => s.trim())).filter(l => l[0]);
const btnBox = document.getElementById('buttons');
lines.forEach(([id, label, ico]) => button(btnBox, { id, label: label || id, ico }));

const tests = window.MM_TESTS || [];
if (D.testKnoepfe === false || !tests.length) { document.getElementById('testTitle').style.display = 'none'; }
else tests.forEach(t => button(document.getElementById('tests'), { id: t.id, label: t.label, ico: '🧪' }, { text: 'Test' }));

// Modus: Party / Zockmodus (Hintergrund-Overlay liest die Lumia-Variable „mm_modus“)
const modeBox = document.getElementById('modes');
async function setMode(m, b) {
  modeBox.querySelectorAll('.btn').forEach(x => x.classList.toggle('active', x === b));
  try {
    if (window.Overlay) await Overlay.setVariable('mm_modus', m); else if (window.TEST_SEND) window.TEST_SEND('modus:' + m);
    setStatus((m === 'zocken' ? (D.modus2Name || 'Zockmodus') : (D.modus1Name || 'Party')) + ' an', 'ok');
  } catch (e) { setStatus('Modus konnte nicht gesetzt werden', 'err'); }
}
[['party', D.modus1Name || 'Party', '🎉'], ['zocken', D.modus2Name || 'Zockmodus', '🎮']].forEach(([m, label, ico]) => {
  const b = document.createElement('button'); b.className = 'btn';
  b.innerHTML = '<span class="ico"></span><span></span>'; b.firstChild.textContent = ico; b.lastChild.textContent = label;
  b.onclick = () => setMode(m, b); modeBox.append(b);
});

// Kanal umschalten (nur im Live-Studio vorhanden)
if ((window.MM_PROFILE || []).length > 1) {
  const kb = document.getElementById('kanaele'); kb.style.display = '';
  document.getElementById('kanalTitel').style.display = '';
  window.MM_PROFILE.forEach(p => {
    const b = document.createElement('button'); b.className = 'btn' + (p.id === window.MM_PROFIL ? ' active' : '');
    b.innerHTML = '<span class="ico">📺</span><span></span>'; b.lastChild.textContent = p.name;
    b.onclick = async () => { try { await Overlay.setVariable('mm_profil', p.id); setStatus('Kanal: ' + p.name, 'ok'); } catch (e) { setStatus('Kanal konnte nicht gewechselt werden', 'err'); } };
    kb.append(b);
  });
}

// Spiel wählen (Live-Studio): schaltet Zockmodus, OBS-Szene und Spiel-Hintergrund
if ((window.MM_SPIELE || []).length) {
  const box = document.getElementById('spiele'); box.style.display = ''; document.getElementById('spielTitel').style.display = '';
  window.MM_SPIELE.forEach(sp => {
    const b = document.createElement('button'); b.className = 'btn' + (window.MM_MODUS === 'zocken' && sp.id === window.MM_SPIEL ? ' active' : '');
    b.innerHTML = '<span class="ico">🎮</span><span></span>'; b.lastChild.textContent = sp.name;
    b.onclick = async () => {
      box.querySelectorAll('.btn').forEach(x => x.classList.toggle('active', x === b));
      modeBox.querySelectorAll('.btn').forEach((x, i) => x.classList.toggle('active', i === 1));
      try { await Overlay.setVariable('mm_spiel', sp.id); setStatus('Zocke: ' + sp.name, 'ok'); } catch (e) { setStatus('Fehler beim Umschalten', 'err'); }
    };
    box.append(b);
  });
}

});</script></body></html>
